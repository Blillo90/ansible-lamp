- name: Paso 11 - Backups automáticos con Restic
  hosts: all
  become: true

  tasks:
    - name: Instalar Restic
      apt:
        name: restic
        state: present
        update_cache: true

- name: Configurar servidor de copias
  hosts: backup
  become: true

  tasks:
    - name: Crear usuario backup
      user:
        name: "{{ backup_user }}"
        shell: /bin/bash
        create_home: true

    - name: Crear directorio del repositorio Restic
      file:
        path: "{{ restic_repo }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: '0755'

    - name: Inicializar repositorio Restic
      shell: |
        export RESTIC_PASSWORD="{{ restic_password }}"
        restic init --repo "{{ restic_repo }}"
      args:
        creates: "{{ restic_repo }}/config"
      become_user: "{{ backup_user }}"

- name: Configurar backup del master
  hosts: master
  become: true

  tasks:
    - name: Crear archivo de variables Restic en master
      copy:
        dest: /etc/restic.env
        mode: '0600'
        content: |
          export RESTIC_REPOSITORY=sftp:{{ backup_user }}@{{ backup_server_ip }}:{{ restic_repo }}
          export RESTIC_PASSWORD={{ restic_password }}

    - name: Crear script backup wordpress
      copy:
        dest: /usr/local/bin/backup_wordpress.sh
        mode: '0755'
        content: |
          #!/bin/bash
          source /etc/restic.env
          restic backup /home/david/ansible-lamp
          restic forget --keep-last 7 --prune

    - name: Programar cron backup master
      cron:
        name: "Backup WordPress con Restic"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/backup_wordpress.sh"

- name: Configurar backup de base de datos
  hosts: db
  become: true

  tasks:
    - name: Crear archivo de variables Restic en db
      copy:
        dest: /etc/restic.env
        mode: '0600'
        content: |
          export RESTIC_REPOSITORY=sftp:{{ backup_user }}@{{ backup_server_ip }}:{{ restic_repo }}
          export RESTIC_PASSWORD={{ restic_password }}

    - name: Crear script backup mariadb
      copy:
        dest: /usr/local/bin/backup_mariadb.sh
        mode: '0755'
        content: |
          #!/bin/bash
          source /etc/restic.env
          mysqldump -u {{ wp_db_user }} -p{{ wp_db_pass }} {{ wp_db_name }} > /tmp/wordpress.sql
          restic backup /tmp/wordpress.sql
          rm -f /tmp/wordpress.sql
          restic forget --keep-last 7 --prune

    - name: Programar cron backup db
      cron:
        name: "Backup MariaDB con Restic"
        minute: "30"
        hour: "2"
        job: "/usr/local/bin/backup_mariadb.sh"