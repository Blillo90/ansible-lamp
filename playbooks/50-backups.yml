- name: Paso 11 - Backups automáticos con Restic
  hosts: all
  become: true

  tasks:
    - name: Instalar Restic
      apt:
        name: restic
        state: present
        update_cache: true

- name: Configurar servidor de copias
  hosts: backup
  become: true

  tasks:
    - name: Crear usuario backup
      user:
        name: "{{ backup_user }}"
        shell: /bin/bash
        create_home: true

    - name: Crear directorio .ssh de backup
      file:
        path: "/home/{{ backup_user }}/.ssh"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: '0700'

    - name: Crear directorio del repositorio Restic
      file:
        path: "{{ restic_repo }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: '0755'

    - name: Inicializar repositorio Restic
      command: restic init --repo {{ restic_repo }}
      environment:
        RESTIC_PASSWORD: "{{ restic_password }}"
      args:
        creates: "{{ restic_repo }}/config"

    - name: Asegurar propietario del repositorio Restic
      file:
        path: "{{ restic_repo }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        recurse: true

- name: Configurar backup del master
  hosts: master
  become: true

  tasks:
    - name: Generar clave SSH para root en master si no existe
      openssh_keypair:
        path: /root/.ssh/id_ed25519
        type: ed25519
        owner: root
        group: root
        mode: '0600'

    - name: Leer clave pública del master
      slurp:
        src: /root/.ssh/id_ed25519.pub
      register: master_pubkey

    - name: Autorizar clave pública del master en backup
      authorized_key:
        user: "{{ backup_user }}"
        key: "{{ master_pubkey.content | b64decode }}"
      delegate_to: lamp-backup

    - name: Crear archivo de variables Restic en master
      copy:
        dest: /etc/restic.env
        mode: '0600'
        content: |
          export RESTIC_REPOSITORY=sftp:{{ backup_user }}@{{ backup_server_ip }}:{{ restic_repo }}
          export RESTIC_PASSWORD={{ restic_password }}

    - name: Crear script backup wordpress
      copy:
        dest: /usr/local/bin/backup_wordpress.sh
        mode: '0755'
        content: |
          #!/bin/bash
          source /etc/restic.env
          export HOME=/root
          restic backup /home/david/ansible-lamp
          restic forget --keep-last 7 --prune

    - name: Programar cron backup master
      cron:
        name: "Backup WordPress con Restic"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/backup_wordpress.sh"

- name: Configurar backup de base de datos
  hosts: db
  become: true

  tasks:
    - name: Generar clave SSH para root en db si no existe
      openssh_keypair:
        path: /root/.ssh/id_ed25519
        type: ed25519
        owner: root
        group: root
        mode: '0600'

    - name: Leer clave pública de db
      slurp:
        src: /root/.ssh/id_ed25519.pub
      register: db_pubkey

    - name: Autorizar clave pública de db en backup
      authorized_key:
        user: "{{ backup_user }}"
        key: "{{ db_pubkey.content | b64decode }}"
      delegate_to: lamp-backup

    - name: Crear archivo de variables Restic en db
      copy:
        dest: /etc/restic.env
        mode: '0600'
        content: |
          export RESTIC_REPOSITORY=sftp:{{ backup_user }}@{{ backup_server_ip }}:{{ restic_repo }}
          export RESTIC_PASSWORD={{ restic_password }}

    - name: Crear script backup mariadb
      copy:
        dest: /usr/local/bin/backup_mariadb.sh
        mode: '0755'
        content: |
          #!/bin/bash
          source /etc/restic.env
          export HOME=/root
          mysqldump -u {{ wp_db_user }} -p{{ wp_db_pass }} {{ wp_db_name }} > /tmp/wordpress.sql
          restic backup /tmp/wordpress.sql
          rm -f /tmp/wordpress.sql
          restic forget --keep-last 7 --prune

    - name: Programar cron backup db
      cron:
        name: "Backup MariaDB con Restic"
        minute: "30"
        hour: "2"
        job: "/usr/local/bin/backup_mariadb.sh"