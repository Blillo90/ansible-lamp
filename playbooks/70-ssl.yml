- name: Paso 12 - Configurar SSL autofirmado para WordPress
  hosts: master
  become: true

  vars:
    kubeconfig_path: /home/david/.kube/config
    cert_path: /tmp/wordpress.crt
    key_path: /tmp/wordpress.key
    tls_secret_name: wordpress-tls

  tasks:
    - name: Instalar openssl
      apt:
        name: openssl
        state: present
        update_cache: true

    - name: Asegurar directorio .kube para david
      file:
        path: /home/david/.kube
        state: directory
        owner: david
        group: david
        mode: '0700'

    - name: Copiar kubeconfig de k3s para david
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/david/.kube/config
        remote_src: true
        owner: david
        group: david
        mode: '0600'

    - name: Instalar dependencias Python para Kubernetes
      apt:
        name:
          - python3
          - python3-pip
          - python3-yaml
          - python3-kubernetes
        state: present
        update_cache: true

    - name: Generar clave privada
      command: openssl genrsa -out {{ key_path }} 2048
      args:
        creates: "{{ key_path }}"

    - name: Generar certificado autofirmado
      command: >
        openssl req -x509 -new -nodes
        -key {{ key_path }}
        -sha256 -days 365
        -out {{ cert_path }}
        -subj /CN={{ wp_host }}
      args:
        creates: "{{ cert_path }}"

    - name: Leer certificado generado
      slurp:
        src: "{{ cert_path }}"
      register: cert_file

    - name: Leer clave privada generada
      slurp:
        src: "{{ key_path }}"
      register: key_file

    - name: Crear Secret TLS en Kubernetes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ tls_secret_name }}"
            namespace: "{{ wp_namespace }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ cert_file.content }}"
            tls.key: "{{ key_file.content }}"

    - name: Crear o actualizar Ingress con HTTPS
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ wp_ingress_name }}"
            namespace: "{{ wp_namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
          spec:
            tls:
              - secretName: "{{ tls_secret_name }}"
            rules:
              - host: "{{ wp_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: wordpress-svc
                          port:
                            number: 80