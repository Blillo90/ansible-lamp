- name: Paso 12 - Monitorización básica con Node Exporter
  hosts: all
  become: true

  vars:
    node_exporter_version: "1.8.1"

  tasks:
    - name: Crear usuario node_exporter
      user:
        name: node_exporter
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Descargar Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'

    - name: Descomprimir Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Copiar binario node_exporter
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Crear servicio systemd de node_exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Recargar systemd
      systemd:
        daemon_reload: true

    - name: Habilitar y arrancar Node Exporter
      service:
        name: node_exporter
        state: started
        enabled: true

    - name: Abrir puerto 9100 en UFW
      ufw:
        rule: allow
        port: "9100"
        proto: tcp