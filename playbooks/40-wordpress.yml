- name: Paso 9 - WordPress en Kubernetes con balanceo (replicas + Ingress)
  hosts: master
  become: true

  vars_files:
    - ../group_vars/all/vars.yml

  vars:
    # En k3s este kubeconfig ES el bueno (evita x509 y problemas de CA)
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml

  pre_tasks:
    - name: Convertir wp_replicas a int real
      set_fact:
        wp_replicas_int: "{{ wp_replicas | int }}"

    # ✅ Construimos el manifest como YAML "texto" y lo parseamos a dict:
    # así replicas queda como entero REAL (3) y no como string ("3")
    - name: Construir manifiesto Deployment WordPress (replicas INT real)
      set_fact:
        wp_deployment_manifest: "{{ wp_deployment_manifest_yaml | from_yaml }}"
      vars:
        wp_deployment_manifest_yaml: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: wordpress
            namespace: {{ wp_namespace }}
          spec:
            replicas: {{ wp_replicas_int }}
            selector:
              matchLabels:
                app: wordpress
            template:
              metadata:
                labels:
                  app: wordpress
              spec:
                containers:
                  - name: wordpress
                    image: {{ wp_image }}
                    ports:
                      - containerPort: 80
                    envFrom:
                      - secretRef:
                          name: wp-db-secret

  tasks:
    - name: Crear namespace WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ wp_namespace }}"

    - name: Crear/actualizar Secret con credenciales DB
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: wp-db-secret
            namespace: "{{ wp_namespace }}"
          type: Opaque
          stringData:
            WORDPRESS_DB_NAME: "{{ wp_db_name }}"
            WORDPRESS_DB_USER: "{{ wp_db_user }}"
            WORDPRESS_DB_PASSWORD: "{{ wp_db_pass }}"
            WORDPRESS_DB_HOST: "{{ wp_db_host }}"

    - name: Crear/actualizar Deployment WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        wait_timeout: 300
        definition: "{{ wp_deployment_manifest }}"

    - name: Crear/actualizar Service wordpress-svc
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: wordpress-svc
            namespace: "{{ wp_namespace }}"
          spec:
            selector:
              app: wordpress
            ports:
              - port: 80
                targetPort: 80

    - name: Crear/actualizar Ingress WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ wp_ingress_name }}"
            namespace: "{{ wp_namespace }}"
          spec:
            rules:
              - host: "{{ wp_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: wordpress-svc
                          port:
                            number: 80

    - name: Esperar a que WordPress esté disponible
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: wordpress
        namespace: "{{ wp_namespace }}"
      register: wp_deploy_info
      until: >
        (wp_deploy_info.resources | length) > 0 and
        (wp_deploy_info.resources[0].status.availableReplicas | default(0) | int)
        >= (wp_replicas_int | int)
      retries: 40
      delay: 6