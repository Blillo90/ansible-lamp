- name: Paso 9 - WordPress en Kubernetes con un solo pod + Ingress
  hosts: master
  become: true

  vars:
    kubeconfig_path: /home/david/.kube/config

  tasks:
    - name: Instalar dependencias Python para Kubernetes
      apt:
        name:
          - python3
          - python3-pip
          - python3-yaml
        state: present
        update_cache: true

    - name: Instalar librería kubernetes para Python
      apt:
        name: python3-kubernetes
        state: present

    - name: Asegurar directorio .kube para david
      file:
        path: /home/david/.kube
        state: directory
        owner: david
        group: david
        mode: '0700'

    - name: Copiar kubeconfig de k3s para david
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/david/.kube/config
        remote_src: true
        owner: david
        group: david
        mode: '0600'

    - name: Crear namespace WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ wp_namespace }}"

    - name: Crear o actualizar Secret con credenciales DB
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: wp-db-secret
            namespace: "{{ wp_namespace }}"
          type: Opaque
          stringData:
            WORDPRESS_DB_NAME: "{{ wp_db_name }}"
            WORDPRESS_DB_USER: "{{ wp_db_user }}"
            WORDPRESS_DB_PASSWORD: "{{ wp_db_pass }}"
            WORDPRESS_DB_HOST: "{{ wp_db_host }}"

    - name: Crear o actualizar Deployment WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        wait_timeout: 300
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: wordpress
            namespace: "{{ wp_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: wordpress
            template:
              metadata:
                labels:
                  app: wordpress
              spec:
                containers:
                  - name: wordpress
                    image: "{{ wp_image }}"
                    ports:
                      - containerPort: 80
                    envFrom:
                      - secretRef:
                          name: wp-db-secret

    - name: Crear o actualizar Service wordpress-svc
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: wordpress-svc
            namespace: "{{ wp_namespace }}"
          spec:
            selector:
              app: wordpress
            ports:
              - protocol: TCP
                port: 80
                targetPort: 80

    - name: Crear o actualizar Ingress WordPress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ wp_ingress_name }}"
            namespace: "{{ wp_namespace }}"
          spec:
            rules:
              - host: "{{ wp_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: wordpress-svc
                          port:
                            number: 80

    - name: Esperar a que el deployment de WordPress esté disponible
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: wordpress
        namespace: "{{ wp_namespace }}"
      register: wp_deploy_info
      until: >
        (wp_deploy_info.resources | length) > 0 and
        (wp_deploy_info.resources[0].status.availableReplicas | default(0) | int) >= 1
      retries: 40
      delay: 6